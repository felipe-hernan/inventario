<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock del almacén (demo Bootstrap)</title>
  <meta name="description" content="Demo de un sistema para almacén hecha con Bootstrap 5: ventas, caja, fiado, stock con vencimientos e informes.">
  <script>
    // Modo claro u oscuro según la configuración del sistema (color modes de Bootstrap 5.3)
    (function () {
      const m = window.matchMedia('(prefers-color-scheme: dark)');
      const aplicar = () => document.documentElement.setAttribute('data-bs-theme', m.matches ? 'dark' : 'light');
      aplicar();
      m.addEventListener('change', aplicar);
    })();
  </script>
  <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css?v=2">
  <link rel="stylesheet" href="lib/bootstrap-icons/font/bootstrap-icons.min.css?v=2">
  <link rel="stylesheet" href="css/tema.css?v=2">
</head>
<body>
  <div class="app">
    <!-- Barra superior: solo en celular y tablet -->
    <nav class="navbar barra-movil d-lg-none sticky-top" data-bs-theme="dark" aria-label="Barra superior">
      <div class="container-fluid">
        <a class="navbar-brand marca-chica" href="#inicio">Almacén</a>
        <div class="d-flex align-items-center gap-1">
          <div class="dropdown">
            <button class="btn boton-notif position-relative" type="button" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false" aria-label="Notificaciones">
              <i class="bi bi-bell fs-5"></i>
              <span class="insignia position-absolute badge rounded-pill text-bg-warning" hidden></span>
            </button>
            <div class="dropdown-menu dropdown-menu-end shadow p-0 panel-notif"></div>
          </div>
          <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#barra" aria-controls="barra" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>
      </div>
    </nav>

    <div class="d-lg-flex">
      <!-- Barra lateral: fija en escritorio, menú deslizable en celular -->
      <aside class="offcanvas-lg offcanvas-start barra" tabindex="-1" id="barra" data-bs-theme="dark" aria-label="Menú principal">
        <div class="offcanvas-header">
          <span class="marca-chica h5 mb-0">Almacén</span>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#barra" aria-label="Cerrar menú"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
          <div class="d-none d-lg-flex align-items-start justify-content-between px-3 pt-4 pb-3">
            <a class="marca" href="#inicio">
              <span class="d-block fs-4 fw-bold">Almacén</span>
              <span class="d-block small opacity-75">Control de stock</span>
            </a>
            <div class="dropdown dropend">
              <button class="btn boton-notif position-relative" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Notificaciones"
                data-bs-popper-config='{"strategy":"fixed"}'>
                <i class="bi bi-bell fs-5"></i>
                <span class="insignia position-absolute badge rounded-pill text-bg-warning" hidden></span>
              </button>
              <div class="dropdown-menu shadow p-0 panel-notif"></div>
            </div>
          </div>
          <div id="estado-caja" class="px-3 mb-3"></div>
          <nav class="nav nav-pills flex-column px-2 gap-1 menu" aria-label="Secciones">
            <a class="nav-link" href="#inicio" data-vista="inicio"><i class="bi bi-house"></i> Inicio</a>
            <a class="nav-link" href="#vender" data-vista="vender"><i class="bi bi-cart3"></i> Vender</a>
            <a class="nav-link" href="#clientes" data-vista="clientes"><i class="bi bi-people"></i> Clientes</a>
            <a class="nav-link" href="#productos" data-vista="productos"><i class="bi bi-tags"></i> Productos</a>
            <a class="nav-link" href="#mercaderia" data-vista="mercaderia"><i class="bi bi-box-seam"></i> Mercadería</a>
            <a class="nav-link" href="#caja" data-vista="caja"><i class="bi bi-cash-stack"></i> Caja</a>
            <a class="nav-link" href="#informes" data-vista="informes"><i class="bi bi-bar-chart-line"></i> Informes</a>
            <a class="nav-link" href="#usuarios" data-vista="usuarios"><i class="bi bi-person-gear"></i> Usuarios</a>
            <a class="nav-link" href="#configuracion" data-vista="configuracion"><i class="bi bi-gear"></i> Configuración</a>
          </nav>
          <div class="mt-auto px-3 pb-3 pt-4">
            <div id="usuario-actual"></div>
            <div class="nota-demo small opacity-75 mt-3">
              <p class="mb-2">Versión de prueba. Los datos se guardan solo en este navegador.</p>
              <button type="button" class="btn btn-sm btn-outline-light" data-accion="datos-abrir">Datos de la demo</button>
            </div>
          </div>
        </div>
      </aside>

      <main id="vista" class="flex-grow-1" tabindex="-1"></main>
    </div>
  </div>

  <!-- Modal único que reutilizan todas las pantallas -->
  <div class="modal fade" id="dlg" tabindex="-1" aria-labelledby="dlg-titulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"></div></div>
  </div>

  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
    <div id="aviso-flotante" class="toast align-items-center text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body fw-semibold"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>
  </div>

  <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js?v=2"></script>
  <script src="js/db.js?v=2"></script>
  <script src="js/logica.js?v=2"></script>
  <script src="js/ui.js?v=2"></script>
  <script src="js/hardware.js?v=2"></script>
  <script src="js/vistas/login.js?v=2"></script>
  <script src="js/vistas/usuarios.js?v=2"></script>
  <script src="js/vistas/inicio.js?v=2"></script>
  <script src="js/vistas/vender.js?v=2"></script>
  <script src="js/vistas/clientes.js?v=2"></script>
  <script src="js/vistas/productos.js?v=2"></script>
  <script src="js/vistas/mercaderia.js?v=2"></script>
  <script src="js/vistas/caja.js?v=2"></script>
  <script src="js/vistas/informes.js?v=2"></script>
  <script src="js/vistas/configuracion.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
